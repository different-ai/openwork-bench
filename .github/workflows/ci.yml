name: CI

on:
  pull_request:
    branches: [pre-release, main]
  push:
    branches: [pre-release, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: Validate tasks (solvable, not gameable)
        run: uv run owb validate
      - name: Tests
        run: uv run pytest -q
      - name: Offline end-to-end demo
        run: uv run owb demo --repeats 1 --out /tmp/owb-demo --site-data /tmp/owb-site/leaderboard.json
      - name: Export tasks dataset (dry run)
        run: uv run owb hub export-tasks --out /tmp/hf-tasks
      - name: World run plan (no spend)
        run: uv run owb world plan

  dco:
    name: dco sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $c is missing a Signed-off-by line (git commit -s)"
              missing=1
            fi
          done
          exit $missing

  release-source:
    name: main accepts releases only
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: head branch is pre-release or hotfix/*
        env:
          HEAD_REF: ${{ github.head_ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          case "$HEAD_REF" in
            pre-release|hotfix/*) [ "$SAME_REPO" = "true" ] && exit 0 ;;
          esac
          echo "::error::main only accepts PRs from pre-release or hotfix/* in this repository; target pre-release instead"
          exit 1

  # Approves a pull request from this repository once every job above passed,
  # so release pull requests into main meet the ruleset's one-approval rule
  # without waiting for a person. Forks are never approved. The approval comes
  # from github-actions, which never pushes, so it counts as an approval after
  # the last push; a new push dismisses it and the next green run approves
  # again. It approves what CI checked, not what a reviewer read.
  approve:
    name: approve when CI passes
    needs: [test, dco, release-source]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: approve the pull request at the head CI checked
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)" != "$HEAD" ]; then
            echo "the pull request moved on since this run; the next run decides"
            exit 0
          fi
          gh pr review "$PR" --repo "$REPO" --approve --body "CI passed at $HEAD."
