name: Leaderboard site

# Builds the leaderboard and deploys it to GitHub Pages. Enable by turning on Pages
# (Settings → Pages → Source: GitHub Actions) and setting the repository variable
# PAGES_ENABLED=true. Until leaderboard/published.yaml pins a results revision, the site
# is built from the offline demo and says so.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.13"
      - run: uv sync --all-extras
      - name: Build leaderboard
        run: |
          REV=$(uv run python -c "import yaml;print(yaml.safe_load(open('leaderboard/published.yaml')).get('results_revision') or '')")
          IDX=$(uv run python -c "import yaml;print(yaml.safe_load(open('leaderboard/published.yaml'))['index_version'])")
          if [ -n "$REV" ]; then
            uv run owb hub pull-results --revision "$REV" --dest hub-results
            uv run owb leaderboard --runs hub-results --index "$IDX" --out site/data/leaderboard.json
            uv run owb site --leaderboard site/data/leaderboard.json --out site/dist
          else
            uv run owb demo --out runs-demo --site-out site/dist
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
