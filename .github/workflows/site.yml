name: site

# Builds the leaderboard and docs (site/, Astro) on every pull request and publishes them to
# GitHub Pages from pre-release. The leaderboard comes from the results pinned in
# leaderboard/published.yaml: a folder in this repository (results_path), a Hugging Face results
# revision, or the offline demo until either is pinned.
on:
  push:
    branches: [pre-release]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
      - run: uv sync --all-extras
      - name: Leaderboard data
        run: |
          REV=$(uv run python -c "import yaml;print(yaml.safe_load(open('leaderboard/published.yaml')).get('results_revision') or '')")
          LOCAL=$(uv run python -c "import yaml;print(yaml.safe_load(open('leaderboard/published.yaml')).get('results_path') or '')")
          IDX=$(uv run python -c "import yaml;print(yaml.safe_load(open('leaderboard/published.yaml'))['index_version'])")
          if [ -n "$LOCAL" ]; then
            NOTE=$(uv run python -c "import yaml;print(yaml.safe_load(open('leaderboard/published.yaml')).get('note') or '')")
            uv run owb leaderboard --runs "$LOCAL" --index "$IDX" --note "$NOTE" --out site/public/leaderboard.json
          elif [ -n "$REV" ]; then
            uv run owb hub pull-results --revision "$REV" --dest hub-results
            uv run owb leaderboard --runs hub-results --index "$IDX" --out site/public/leaderboard.json
          else
            uv run owb demo --out runs-demo --site-data site/public/leaderboard.json
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      # Syncs docs/, builds the leaderboard page and the docs, and checks every docs link.
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # The deploy succeeding is not the site working: fetch each kind of page from the live site,
  # with retries while the CDN catches up, and fail loudly if one is missing or broken.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: The published site serves every kind of page
        env:
          SITE: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          fetch() { curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors --max-time 30 "$SITE$1"; }
          # Read the whole page before matching: piping curl into grep -q closes the pipe at the
          # first match, and pipefail would count curl's write error as a failed check.
          expect() {
            for attempt in 1 2 3 4 5 6; do
              if body=$(fetch "$1") && grep -q -- "$2" <<<"$body"; then echo "ok  /$1"; return 0; fi
              sleep 10
            done
            echo "::error::$SITE$1 does not contain $2"; return 1
          }
          lb=$(fetch leaderboard.json)
          model=$(jq -r '.subjects[0].id' <<<"$lb" | tr 'A-Z' 'a-z' | sed -E 's/[^a-z0-9.-]+/-/g')
          task=$(jq -r '.tasks[0].id' <<<"$lb" | tr 'A-Z' 'a-z' | sed -E 's/[^a-z0-9.-]+/-/g')
          expect "" 'property="og:image"'
          expect "models/" '<h1>Models</h1>'
          expect "models/$model/" 'property="og:title"'
          expect "tasks/" '<h1>Tasks</h1>'
          expect "tasks/$task/" 'property="og:title"'
          expect "readiness/" '<h1>Readiness</h1>'
          expect "changelog/" '<h1>Changelog</h1>'
          expect "docs/methodology/" 'property="og:image"'
          expect "favicon.svg" '<svg'
          type=$(curl -fsSI --retry 6 --retry-delay 10 --retry-all-errors "${SITE}og.png" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2}')
          [ "$type" = "image/png" ] || { echo "::error::${SITE}og.png is not served as image/png ($type)"; exit 1; }
          echo "ok  /og.png ($type)"

