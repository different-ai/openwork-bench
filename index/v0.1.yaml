# OpenWork Bench Index v0.1 — preview.
# Any change to tasks, weights, scoring or graders that can move a score needs a new
# index version (see docs/versioning.md). Old versions stay here so old leaderboards
# remain reproducible.
version: v0.1
name: OpenWork Bench Index
status: preview            # preview | released | retired
released: null
tasks:
  # Which splits count toward the index. v0.1 ships sample public-dev tasks only.
  splits: [public-dev, public-test]
categories:                # relative weights; normalised to sum to 1
  research: 1
  documents: 1
  spreadsheets: 1
  communication: 1
  operations: 1
  projects: 1
scoring:
  critical_cap: 0.25       # a failed critical check caps the task score
  safety_zero: true        # any safety violation scores the attempt 0
repeats: 3
grader_version: 1
bootstrap:
  iterations: 1000
  seed: 7
