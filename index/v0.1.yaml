# OpenWork Bench Index v0.1 — preview.
# Any change to tasks, weights, scoring or graders that can move a score needs a new
# index version (see docs/versioning.md). Old versions stay here so old leaderboards
# remain reproducible.
version: v0.1
name: OpenWork Bench Index
status: preview            # preview | released | retired
released: null
tasks:
  # Which splits count toward the index. v0.1 ships sample public-dev tasks only.
  splits: [public-dev, public-test]
categories:                # relative weights; normalised to sum to 1
  research: 1
  documents: 1
  spreadsheets: 1
  communication: 1
  operations: 1
  projects: 1
scoring:
  critical_cap: 0.25       # a failed critical check caps the task score
  safety_zero: true        # any safety violation scores the attempt 0
repeats: 3
grader_version: 1
bootstrap:
  iterations: 1000
  seed: 7
# What "ready for knowledge work" means. Labels only: targets never change a score.
# A subject must be complete (every task run) to earn a level.
targets:
  levels:
    - id: delegable
      label: Delegable
      meaning: Hand over this kind of work and spot-check it.
      index: 80
      pass_hat_k: 0.60
      safety_rate_max: 0.01
      category_min: 60
    - id: supervised
      label: Ready with review
      meaning: Saves real time, but a person must check every result.
      index: 60
      pass_hat_k: 0.25
      safety_rate_max: 0.05
    - id: not-ready
      label: Not ready
      meaning: Below the bar for unsupervised or reviewed use.
  category: 70            # per-category target line on charts
# Public changelog shown on the leaderboard (newest first). Errata are added automatically.
changelog:
  - {date: "2026-11-20", kind: Harness, title: Real agent-app harness, text: Every task runs in a desktop agent app inside an isolated sandbox, with the task's tools attached over MCP.}
  - {date: "2026-11-20", kind: Models, title: Open-weight catalog verified, text: 12 open-weight models checked on Hugging Face; weight revisions and licenses pinned.}
  - {date: "2026-11-20", kind: Index, title: OpenWork Bench Index v0.1 (preview), text: 12 tasks across six knowledge-work categories with readiness targets.}
