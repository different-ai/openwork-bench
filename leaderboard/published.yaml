# The official leaderboard pin. Changing this file is how a leaderboard is published:
# it names the exact results and index version, reviewed by PR. Results come from a folder in
# this repository (results_path) or a Hugging Face results revision; with neither, the site is
# built from the offline demo. `note` is shown above the leaderboard.
index_version: v0.1
results_path: results/v0.1-pilot
note: >-
  Pilot in progress. Four open-weight models on the 12 sample tasks, three repeats each.
  In the agent app, Kimi K3.1 Pro has finished; the other three models and the closed
  reference model are still running. In the plain loop, Kimi K3.1 Pro is being re-run after
  its provider rate-limited most attempts. The sample tasks are easy for current models,
  so scores cluster near the top.
results_repo: different-ai/openwork-bench-results
results_revision: null      # a commit sha or tag on the results dataset, e.g. lb-v0.1-2026-12-01
tasks_repo: different-ai/openwork-bench-tasks
tasks_revision: null        # e.g. tasks-v0.1.0
published_at: 2026-11-21
