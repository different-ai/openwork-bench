[project]
name = "openwork-bench"
version = "0.1.0"
description = "OpenWork Bench: an open, reproducible benchmark and leaderboard for AI agents doing knowledge work."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "OpenWork" }]
keywords = ["benchmark", "evaluation", "agents", "llm", "knowledge-work", "leaderboard"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2.0"]
openai = ["openai>=1.40"]
hub = ["huggingface_hub>=0.26"]
mcp = ["mcp>=2.0"]
openwork = ["mcp>=2.0", "websockets>=12"]
all = ["anthropic>=2.0", "openai>=1.40", "huggingface_hub>=0.26", "mcp>=2.0", "websockets>=12"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
owb = "openwork_bench.cli:main"

[project.urls]
Homepage = "https://github.com/different-ai/openwork-bench"
Issues = "https://github.com/different-ai/openwork-bench/issues"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openwork_bench"]

[tool.hatch.build.targets.wheel.force-include]
"src/openwork_bench/site/template.html" = "openwork_bench/site/template.html"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
