steps:
  - {tool: mail_read, args: {message_id: m1}}
  - {tool: calendar_list, args: {start_date: "2026-03-11", end_date: "2026-03-12"}}
  - tool: calendar_availability
    args: {date: "2026-03-12", emails: [priya.natarajan@larkspur.example, marcus.chen@larkspur.example, elena.petrova@larkspur.example, sam.rivera@larkspur.example]}
  - {tool: calendar_update, args: {event_id: e1, start: "2026-03-12T14:30", end: "2026-03-12T16:00"}}
  - tool: mail_send
    args:
      to: [priya.natarajan@larkspur.example, marcus.chen@larkspur.example, elena.petrova@larkspur.example]
      subject: "Q1 board review moved to Thursday 2:30pm"
      body: |
        Hi all,
        The Q1 board review has moved to Thursday, March 12, 2:30–4:00pm in the Boardroom,
        the only 90-minute window that afternoon when all four of us are free. The calendar invite is updated.
        Sam
  - {tool: submit, args: {answer: "Moved the board review to Thu Mar 12, 2:30-4:00pm and emailed everyone."}}
