    - tom.alvarez@larkspur.example
    - sam.rivera@larkspur.example
    - nadia.kim@larkspur.example
    - omar.haddad@larkspur.example
    - lucia.romano@larkspur.example
    - ben.carter@larkspur.example
    - mei.tanaka@larkspur.example
    - kwame.mensah@larkspur.example
    - sofia.lindqvist@larkspur.example
    - diego.herrera@larkspur.example
    - hana.novak@larkspur.example
    - liam.obrien@larkspur.example
    - zara.ahmed@larkspur.example
- tool: mail_send
  args:
    to:
    - priya.natarajan@larkspur.example
    - marcus.chen@larkspur.example
    - elena.petrova@larkspur.example
    - jordan.blake@larkspur.example
    - aisha.okafor@larkspur.example
    - tom.alvarez@larkspur.example
    - nadia.kim@larkspur.example
    - omar.haddad@larkspur.example
    - lucia.romano@larkspur.example
