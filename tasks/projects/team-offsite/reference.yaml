steps:
- tool: drive_list
  args:
    folder: /offsite
- tool: drive_read
  args:
    path: /offsite/brief.md
- tool: drive_read
  args:
    path: /offsite/venues.csv
- tool: drive_read
  args:
    path: /offsite/attendees.csv
- tool: drive_write
  args:
    path: /offsite/plan.md
    content: '# Spring team offsite plan


      - **Date:** Thursday, April 23, 2026, 9:00am–5:00pm

      - **Venue:** Maple Hall (capacity 25, projector, 12 miles away)

      - **Total cost:** $4,910 = $3,200 venue + 18 × $95 catering (budget $6,000)


      ## Catering head-count (18 people)

      - Vegetarian: 4

      - Vegan: 2

      - Gluten-free: 1

      - No restrictions: 11


      ## Why Maple Hall

      Cheapest venue meeting every requirement. Riverside Loft has no projector, Summit Lodge is 45 miles away,

      The Foundry only seats 16, and Cedar Commons would cost $5,130.

      '
- tool: calendar_create
  args:
    title: Team offsite
    start: 2026-04-23T09:00
    end: 2026-04-23T17:00
    location: Maple Hall
    attendees:
    - priya.natarajan@larkspur.example
    - marcus.chen@larkspur.example
    - elena.petrova@larkspur.example
    - jordan.blake@larkspur.example
