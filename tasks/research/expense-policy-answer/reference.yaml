steps:
  - {tool: mail_read, args: {message_id: m1}}
  - {tool: drive_search, args: {query: dinner}}
  - {tool: drive_read, args: {path: /policies/travel-and-expense-policy-2025.md}}
  - tool: mail_send
    args:
      to: [jordan.blake@larkspur.example]
      subject: "Re: Can I expense this dinner?"
      reply_to_id: m1
      body: |
        Hi Jordan,

        Yes, mostly. Under the 2025 Travel & Expense Policy the dinner limit is $60 per person and
        alcohol is never reimbursable, so you can expense $56 (the $68 bill minus the $12 glass of wine).
        That is under the $60 cap.

        Please keep the itemized receipt (required for anything over $25) and submit it in the expense
        tool within 30 days.

        Sam
  - {tool: submit, args: {answer: "Replied to Jordan: $56 reimbursable (wine excluded), itemized receipt required."}}
