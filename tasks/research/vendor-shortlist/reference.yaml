steps:
  - {tool: drive_list, args: {folder: /vendors}}
  - {tool: drive_read, args: {path: /vendors/requirements.md}}
  - {tool: drive_read, args: {path: /vendors/proposal-harbor-line.md}}
  - {tool: drive_read, args: {path: /vendors/proposal-bramble.md}}
  - {tool: drive_read, args: {path: /vendors/proposal-cobalt-route.md}}
  - tool: drive_write
    args:
      path: /memos/3pl-recommendation.md
      content: |
        # Recommendation: 3PL vendor

        **Recommend Bramble Logistics.** It is the only proposal that meets all three requirements
        (99.9% uptime SLA, East Coast coverage, onboarding within 6 weeks). Total first-year cost:
        **$84,000** ($6,500 × 12 + $6,000 onboarding), with a 5-week onboarding.

        Ruled out:
        - **Harbor Line Freight** ($78,400 first year): uptime SLA is only 99.5%, below our 99.9% requirement.
        - **Cobalt Route Logistics** ($78,200 first year): onboarding takes 8 weeks, past our 6-week limit.
  - {tool: submit, args: {answer: "Bramble Logistics, $84,000 first-year cost"}}
